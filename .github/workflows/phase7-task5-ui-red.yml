name: Phase 7 Task 5 UI Format

on:
  push:
    branches:
      - codex/phase-7-task5-ui-red

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/assistant/assistant-card.tsx src/features/assistant/assistant-card.test.tsx
      - run: |
          echo '__CARD_BEGIN__'
          cat src/features/assistant/assistant-card.tsx
          echo '__CARD_END__'
          echo '__TEST_BEGIN__'
          cat src/features/assistant/assistant-card.test.tsx
          echo '__TEST_END__'
