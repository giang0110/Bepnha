name: Phase 7 Task 5 UI GREEN

on:
  push:
    branches:
      - codex/phase-7-task5-ui-red

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/features/assistant/assistant-api.test.ts src/features/assistant/assistant-card.test.tsx
      - run: npx prettier --check src/features/assistant/assistant-api.ts src/features/assistant/assistant-api.test.ts src/features/assistant/assistant-card.tsx src/features/assistant/assistant-card.test.tsx
      - run: npm run typecheck
      - run: npm run lint
