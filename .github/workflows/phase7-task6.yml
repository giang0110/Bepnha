name: Phase 7 Task 6 Isolation Gates

on:
  push:
    branches:
      - codex/phase-7-task6-isolation

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration:assistant
