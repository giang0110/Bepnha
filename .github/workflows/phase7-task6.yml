name: Phase 7 Task 6 Isolation Gates

on:
  push:
    branches:
      - codex/phase-7-task6-isolation

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show Prettier diff for Task 6 tests
        run: |
          npx prettier --write tests/assistant.spec.ts tests/integration/assistant-api.integration.test.ts
          git diff -- tests/assistant.spec.ts tests/integration/assistant-api.integration.test.ts
          exit 1
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run preflight:db
      - run: npm run supabase:start
      - run: npm run supabase:reset
      - run: npm run test:integration:planner
      - run: npm run test:integration:assistant
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:assistant
      - if: always()
        run: npm run supabase:stop
