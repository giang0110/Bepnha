name: Task 7 lint fix

on:
  push:
    branches:
      - codex/phase-4-task7-clean
    paths:
      - .github/workflows/task7-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-task7-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply lint-safe load effect
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/shopping/shopping-list-page.tsx')
          text = path.read_text()
          old = '''  useEffect(() => {
            let active = true
            setState({ status: "loading" })
            setMutationError(null)
            if (planId === "") {
              setState({ status: "missing" })
              return () => {
                active = false
              }
            }
            void repository
              .load(planId, revisionId)
              .then((result) => {
                if (!active) return
                if (result === null) {
                  setState({ status: "missing" })
                } else if (result.status === "legacy_unavailable") {
                  setState({ status: "legacy", value: result })
                } else {
                  setState({ status: "ready", value: result })
                }
              })
              .catch((error: unknown) => {
                if (active) setState({ status: "error", message: errorCopy(error) })
              })
            return () => {
              active = false
            }
          }, [planId, repository, revisionId])
          '''
          new = '''  useEffect(() => {
            let active = true
            async function load() {
              await Promise.resolve()
              if (!active) return
              setMutationError(null)
              if (planId === "") {
                setState({ status: "missing" })
                return
              }
              setState({ status: "loading" })
              try {
                const result = await repository.load(planId, revisionId)
                if (!active) return
                if (result === null) {
                  setState({ status: "missing" })
                } else if (result.status === "legacy_unavailable") {
                  setState({ status: "legacy", value: result })
                } else {
                  setState({ status: "ready", value: result })
                }
              } catch (error: unknown) {
                if (active) setState({ status: "error", message: errorCopy(error) })
              }
            }
            void load()
            return () => {
              active = false
            }
          }, [planId, repository, revisionId])
          '''
          if old not in text:
              raise SystemExit('expected effect block not found')
          path.write_text(text.replace(old, new))
          PY
          npx prettier --write src/app/App.test.tsx src/features/shopping/shopping-list-page.test.tsx src/features/shopping/shopping-list-page.tsx
          npx eslint src/app/App.test.tsx src/features/shopping/shopping-list-page.test.tsx src/features/shopping/shopping-list-page.tsx --max-warnings 0
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.test.tsx src/features/shopping/shopping-list-page.test.tsx src/features/shopping/shopping-list-page.tsx
          git commit -m "fix: satisfy shopping UI lint contract"
          git push origin HEAD:codex/phase-4-task7-clean
