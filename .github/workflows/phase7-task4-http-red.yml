name: Phase 7 Task 4 HTTP FORMAT

on:
  push:
    branches:
      - codex/phase-7-task4-http-red

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/infrastructure/server/assistant-http.test.ts
      - name: Print canonical assistant HTTP test
        run: |
          echo '===ASSISTANT_HTTP_TEST_START==='
          cat src/infrastructure/server/assistant-http.test.ts
          echo '===ASSISTANT_HTTP_TEST_END==='
      - run: npx vitest run src/infrastructure/server/assistant-http.test.ts src/infrastructure/server/operational-telemetry.test.ts src/infrastructure/server/planner-http.test.ts
      - run: npm run typecheck
      - run: npm run lint
