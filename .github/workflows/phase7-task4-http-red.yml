name: Phase 7 Task 4 HTTP GREEN

on:
  push:
    branches:
      - codex/phase-7-task4-http-red

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/infrastructure/server/assistant-http.test.ts src/infrastructure/server/operational-telemetry.test.ts src/infrastructure/server/planner-http.test.ts src/infrastructure/server/gemini-meal-assistant.test.ts
      - run: npx prettier --check src/infrastructure/server/assistant-http.ts src/infrastructure/server/assistant-http.test.ts src/infrastructure/server/operational-telemetry.ts src/infrastructure/server/operational-telemetry.test.ts src/infrastructure/server/gemini-meal-assistant.ts src/infrastructure/server/gemini-meal-assistant.test.ts
      - run: npm run typecheck
      - run: npm run lint
