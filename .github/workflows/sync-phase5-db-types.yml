name: Finalize Phase 5 task 8

# Temporary Phase 5 helper. This run updates docs/fixtures and removes itself.
on:
  push:
    branches:
      - codex/phase-5-pantry
    paths:
      - ".github/workflows/sync-phase5-db-types.yml"

permissions:
  contents: write

concurrency:
  group: finalize-phase5-task8
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-5-pantry
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update Phase 5 shopping fixture and README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shopping = Path("tests/shopping-list.spec.ts")
          text = shopping.read_text()
          old = '''    requiredBaseQuantity,\n    packageBaseQuantity,'''
          new = '''    requiredBaseQuantity,\n    pantryDeductedBaseQuantity: "0",\n    purchaseRequiredBaseQuantity: requiredBaseQuantity,\n    packageBaseQuantity,'''
          if old not in text:
              raise SystemExit("shopping fixture insertion point not found")
          shopping.write_text(text.replace(old, new, 1))

          readme = Path("README.md")
          text = readme.read_text()

          replacements = [
              (
                  'BepNha is a deterministic meal-planning application for Vietnamese households. Phase 4 adds an owner-scoped, mobile-first “Đi chợ” experience bound to an exact immutable meal-plan revision. The shopping list projects the existing authoritative Phase 3 purchase basket; it does not introduce a second quantity, package-rounding, price, or budget calculation.',
                  'BepNha is a deterministic meal-planning application for Vietnamese households. Phase 5 adds an owner-scoped, mobile-first “Tủ bếp” flow, immutable generation-time pantry snapshots, deterministic pantry deduction before the existing package-rounding authority, and pantry-aware shopping evidence. Existing meal-plan revisions are never rewritten when current pantry amounts change.'
              ),
              (
                  '| `/settings/household`              | Version-checked editing of the single owned household                |\n| `/plan`',
                  '| `/settings/household`              | Version-checked editing of the single owned household                |\n| `/pantry`                         | Owner-scoped current pantry amounts used by future plan revisions    |\n| `/plan`'
              ),
              (
                  'Checking an item never changes quantity, package count, price, provenance, budget, or fingerprint. Check state is carried into a replacement revision only when the stable food, canonical base unit, and canonical required amount remain byte-equivalent under the Phase 4 rules.',
                  'Checking an item never changes quantity, package count, price, provenance, budget, fingerprint, or pantry state. Check state is carried into a replacement revision only when the stable food, canonical base unit, and canonical required amount remain byte-equivalent under the shopping rules.\n\n### Pantry authority\n\nPantry stores one current owner-scoped quantity per `(household_id, food_id)`. Each generation or replacement copies the exact normalized pantry snapshot into immutable plan evidence. Shopping deduction is deterministic and happens before package rounding: `gross required = pantry deducted + purchase required`; only the remaining purchase requirement is rounded to purchasable packages. A fully covered line can therefore require zero packages and zero purchase cost.\n\nCurrent pantry edits affect only future calculations. They never rewrite an existing plan revision or its shopping list. Shopping rows persist both `pantryDeductedBaseQuantity` and `purchaseRequiredBaseQuantity`, so every deduction remains traceable after the current pantry changes. Checking a shopping item does not decrement pantry automatically. Phase 5 intentionally has no inventory lots, expiry dates, barcode/OCR, retailer ordering, receipt ingestion, or background inventory jobs.'
              ),
              (
                  'npm run test:integration:shopping\nnpm run test:e2e:onboarding',
                  'npm run test:integration:shopping\nnpm run test:integration:pantry\nnpm run test:e2e:onboarding'
              ),
              (
                  'npm run test:e2e:shopping\nnpm run supabase:stop',
                  'npm run test:e2e:shopping\nnpm run test:e2e:pantry\nnpm run supabase:stop'
              ),
              (
                  'inherited plus Phase 4 pgTAP/RLS/integrity tests, generated-type drift, Auth/household/catalog/admin/planner/shopping integration, onboarding/planner/shopping browser journeys, artifact generation, and always-run cleanup.',
                  'inherited plus Phase 5 pgTAP/RLS/integrity tests, generated-type drift, Auth/household/catalog/admin/planner/shopping/pantry integration, onboarding/planner/shopping/pantry browser journeys, artifact generation, and always-run cleanup.'
              ),
              (
                  'Match evidence to the exact final Phase 4 SHA:',
                  'Match evidence to the exact final Phase 5 SHA:'
              ),
              (
                  '$phase4Head = git rev-parse HEAD\n$phase4Run = gh run list --workflow ci.yml --branch codex/phase-4-shopping-list --commit $phase4Head --limit 1 --json databaseId,headSha,status,conclusion,url | ConvertFrom-Json\nif ($phase4Run.Count -ne 1 -or $phase4Run.headSha -ne $phase4Head) { throw \'No CI run found for exact Phase 4 HEAD\' }\ngh run watch $phase4Run.databaseId --exit-status\n$phase4Jobs = (gh run view $phase4Run.databaseId --json jobs | ConvertFrom-Json).jobs\nif (($phase4Jobs | Where-Object name -eq \'web\').conclusion -ne \'success\') { throw \'CI web job did not pass\' }\nif (($phase4Jobs | Where-Object name -eq \'database\').conclusion -ne \'success\') { throw \'CI database job did not pass\' }',
                  '$phase5Head = git rev-parse HEAD\n$phase5Run = gh run list --workflow ci.yml --branch codex/phase-5-pantry --commit $phase5Head --limit 1 --json databaseId,headSha,status,conclusion,url | ConvertFrom-Json\nif ($phase5Run.Count -ne 1 -or $phase5Run.headSha -ne $phase5Head) { throw \'No CI run found for exact Phase 5 HEAD\' }\ngh run watch $phase5Run.databaseId --exit-status\n$phase5Jobs = (gh run view $phase5Run.databaseId --json jobs | ConvertFrom-Json).jobs\nif (($phase5Jobs | Where-Object name -eq \'web\').conclusion -ne \'success\') { throw \'CI web job did not pass\' }\nif (($phase5Jobs | Where-Object name -eq \'database\').conclusion -ne \'success\') { throw \'CI database job did not pass\' }'
              ),
              (
                  'Record `PHASE_4_PASS` only when all mandatory non-database gates pass, the exact final branch HEAD is pushed, generated database types are clean, and database/RLS/integration/browser verification passes locally or in exact-final-HEAD GitHub Actions. Otherwise record `PHASE_4_BLOCKED` with the exact failed or pending gate.',
                  'Record `PHASE_5_PASS` only when all mandatory non-database gates pass, the exact final branch HEAD is pushed, generated database types are clean, and database/RLS/integration/browser verification passes locally or in exact-final-HEAD GitHub Actions. Otherwise record `PHASE_5_BLOCKED` with the exact failed or pending gate.'
              ),
              (
                  'Phase 4 does **not** add pantry deduction, custom/manual grocery items, retailer/live-price comparison, marketplace flows, delivery, payment, receipts, barcode/OCR, notifications, collaboration/offline sync, or AI/ML shopping behavior. Those remain explicit later-phase work.',
                  'Phase 5 does **not** add pantry lots or expiry tracking, automatic pantry consumption, custom/manual grocery items, retailer/live-price comparison, marketplace flows, delivery, payment, receipts, barcode/OCR, notifications, collaboration/offline sync, or AI/ML shopping behavior. Those remain explicit later-phase work.'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"README replacement point not found: {old[:80]!r}")
              text = text.replace(old, new, 1)
          readme.write_text(text)
          PY
      - run: npx prettier --write tests/shopping-list.spec.ts README.md
      - name: Remove temporary helper and commit Task 8 finalization
        run: |
          git rm .github/workflows/sync-phase5-db-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/shopping-list.spec.ts README.md
          git commit -m "test: finalize Phase 5 pantry verification"
          git push origin HEAD:codex/phase-5-pantry
