name: Format Phase 5 pantry browser spec

# Temporary Phase 5 helper; canonical Prettier pass before removal.
on:
  push:
    branches:
      - codex/phase-5-pantry
    paths:
      - ".github/workflows/sync-phase5-db-types.yml"

permissions:
  contents: write

concurrency:
  group: format-phase5-pantry-spec
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-5-pantry
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/pantry.spec.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- tests/pantry.spec.ts; then
            echo "Pantry browser spec already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/pantry.spec.ts
          git commit -m "style: format Phase 5 pantry browser spec"
          git push origin HEAD:codex/phase-5-pantry
