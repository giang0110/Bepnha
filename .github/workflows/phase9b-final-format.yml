name: Phase 9B Final Formatter

on:
  push:
    branches:
      - codex/phase-9b-production-reference-resolver
    paths:
      - scripts/catalog-pack/catalog-production-resolver-cli.ts
      - scripts/catalog-pack/catalog-production-resolver-cli.test.ts
      - scripts/catalog-pack/catalog-production-resolver.ts
      - scripts/catalog-pack/catalog-production-resolver.test.ts
      - package.json
      - .github/workflows/phase9b-final-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write --no-error-on-unmatched-pattern scripts/catalog-pack/catalog-production-resolver-cli.ts scripts/catalog-pack/catalog-production-resolver-cli.test.ts scripts/catalog-pack/catalog-production-resolver.ts scripts/catalog-pack/catalog-production-resolver.test.ts package.json
      - name: Commit formatted Phase 9B files and remove one-shot workflow
        run: |
          rm .github/workflows/phase9b-final-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/catalog-pack package.json .github/workflows/phase9b-final-format.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format Phase 9B final files"
          git push origin HEAD:codex/phase-9b-production-reference-resolver
