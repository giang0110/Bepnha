name: Phase 4 audit

on:
  push:
    branches:
      - codex/phase-4-task10-clean
    paths:
      - .github/workflows/phase4-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Phase 4 scope and single-authority contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re

          production_files = []
          for root in (Path('src'), Path('api')):
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.js', '.mjs'}:
                      continue
                  if '.test.' in path.name or '.spec.' in path.name or 'tests' in path.parts:
                      continue
                  production_files.append(path)

          texts = [(path, path.read_text()) for path in production_files]
          engine_hits = [
              (path, line_no)
              for path, text in texts
              for line_no, line in enumerate(text.splitlines(), start=1)
              if '"planner-engine-v2"' in line
          ]
          if len(engine_hits) != 1:
              raise SystemExit(f'Expected exactly one production planner-engine-v2 literal, got {engine_hits}')

          basket_pattern = re.compile(r'\b(?:export\s+)?function\s+calculatePurchaseBasket\b')
          basket_hits = [
              (path, match.start())
              for path, text in texts
              for match in basket_pattern.finditer(text)
          ]
          if len(basket_hits) != 1:
              raise SystemExit(f'Expected exactly one calculatePurchaseBasket definition, got {basket_hits}')

          forbidden = re.compile(r'\b(pantry|receipt|barcode|ocr|delivery|payment|retailer|marketplace)\b', re.I)
          scoped_files = texts + [
              (
                  Path('supabase/migrations/20260827000000_phase_4_shopping_list.sql'),
                  Path('supabase/migrations/20260827000000_phase_4_shopping_list.sql').read_text(),
              )
          ]
          forbidden_hits = []
          for path, text in scoped_files:
              for line_no, line in enumerate(text.splitlines(), start=1):
                  if forbidden.search(line):
                      forbidden_hits.append((str(path), line_no, line.strip()))
          if forbidden_hits:
              raise SystemExit(f'Out-of-scope production terms found: {forbidden_hits}')

          if not Path('.github/workflows/ci.yml').is_file():
              raise SystemExit('Missing canonical CI workflow')

          print(f'planner_engine_literal_count={len(engine_hits)}')
          print(f'purchase_basket_definition_count={len(basket_hits)}')
          print('forbidden_scope_hits=0')
          PY
