name: Phase 9B Formatter

on:
  push:
    branches:
      - codex/phase-9b-production-reference-resolver
    paths:
      - scripts/catalog-pack/catalog-production-resolver.ts
      - .github/workflows/phase9b-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/catalog-pack/catalog-production-resolver.ts
      - name: Commit formatted resolver and remove one-shot workflow
        run: |
          rm .github/workflows/phase9b-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-pack/catalog-production-resolver.ts .github/workflows/phase9b-format.yml
          git commit -m "style: apply repo Prettier to Phase 9B resolver"
          git push origin HEAD:codex/phase-9b-production-reference-resolver
