name: Phase 7 Task 4 Runtime Format

on:
  push:
    branches:
      - codex/phase-7-task4-runtime-red

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/infrastructure/server/assistant-runtime.ts
      - run: |
          echo '__RUNTIME_FORMATTED_BEGIN__'
          cat src/infrastructure/server/assistant-runtime.ts
          echo '__RUNTIME_FORMATTED_END__'
