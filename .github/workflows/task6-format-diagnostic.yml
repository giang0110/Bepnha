name: Task 6 format diagnostic

on:
  push:
    branches:
      - codex/phase-4-task6-staging
    paths:
      - tests/integration/shopping-list.integration.test.ts
      - .github/workflows/task6-format-diagnostic.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-task6-staging
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact Prettier output
        run: |
          npx prettier --write tests/integration/shopping-list.integration.test.ts
          git diff --check
          if git diff --quiet -- tests/integration/shopping-list.integration.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/shopping-list.integration.test.ts
          git commit -m "style: format shopping integration test"
          git push origin HEAD:codex/phase-4-task6-staging
