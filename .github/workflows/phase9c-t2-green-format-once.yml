name: Phase 9C Task 2 Green Format Once

on:
  push:
    paths:
      - ".github/workflows/phase9c-t2-green-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/phase-9c-t2-red
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/catalog-pack/catalog-mutation-planner.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-pack/catalog-mutation-planner.ts
          git commit -m "style: format Phase 9C Task 2 planner"
          git push origin HEAD:codex/phase-9c-t2-red
