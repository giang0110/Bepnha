name: Phase 9C Format Once

on:
  push:
    branches:
      - codex/phase-9c-t1-red
    paths:
      - .github/workflows/phase9c-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/phase-9c-t1-red
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Phase 9C files and remove one-shot workflow
        run: |
          npx prettier --write scripts/catalog-pack/catalog-mutation-manifest-parser.ts scripts/catalog-pack/catalog-mutation-test-builder.ts scripts/catalog-pack/catalog-mutation-types.ts scripts/catalog-pack/catalog-mutation-planner.test.ts
          git rm .github/workflows/phase9c-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-pack/catalog-mutation-manifest-parser.ts scripts/catalog-pack/catalog-mutation-test-builder.ts scripts/catalog-pack/catalog-mutation-types.ts scripts/catalog-pack/catalog-mutation-planner.test.ts
          git diff --cached --check
          git commit -m "style: apply repository formatter to Phase 9C Task 1"
          git push origin HEAD:codex/phase-9c-t1-red
