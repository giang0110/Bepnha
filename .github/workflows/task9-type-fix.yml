name: Task 9 type fix

on:
  push:
    branches:
      - codex/phase-4-task9-clean
    paths:
      - .github/workflows/task9-type-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-task9-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix shopping E2E fixture typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/shopping-list.spec.ts')
          text = path.read_text()
          old = '  items: typeof initialItems,\n'
          new = '  items: readonly unknown[],\n'
          if old not in text:
              raise SystemExit('expected shoppingReady parameter not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write tests/shopping-list.spec.ts
          npm run typecheck
          npx eslint tests/shopping-list.spec.ts --max-warnings 0
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/shopping-list.spec.ts
          git commit -m "test: widen shopping fixture response typing"
          git push origin HEAD:codex/phase-4-task9-clean
