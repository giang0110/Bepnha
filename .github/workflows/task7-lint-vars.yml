name: Task 7 lint vars

on:
  push:
    branches:
      - codex/phase-4-task7-clean
    paths:
      - .github/workflows/task7-lint-vars.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-task7-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remove unused mock parameters
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            Path('src/app/App.test.tsx'): (
              'const shoppingLoad = vi.fn((_planId: string, _revisionId?: string | null) =>\n  Promise.resolve<ShoppingListReadResult | null>(null)\n)',
              'const shoppingLoad = vi.fn(() => Promise.resolve<ShoppingListReadResult | null>(null))'
            ),
            Path('src/features/shopping/shopping-list-page.test.tsx'): (
              '  const load = vi.fn((_planId: string, _revisionId?: string | null) =>\n    Promise.resolve<ShoppingListReadResult | null>(initial)\n  )',
              '  const load = vi.fn(() => Promise.resolve<ShoppingListReadResult | null>(initial))'
            )
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected mock block not found: {path}')
              path.write_text(text.replace(old, new))
          PY
          npx prettier --write src/app/App.test.tsx src/features/shopping/shopping-list-page.test.tsx
          npx eslint src/app/App.test.tsx src/features/shopping/shopping-list-page.test.tsx src/features/shopping/shopping-list-page.tsx --max-warnings 0
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.test.tsx src/features/shopping/shopping-list-page.test.tsx
          git commit -m "test: satisfy shopping UI lint contract"
          git push origin HEAD:codex/phase-4-task7-clean
