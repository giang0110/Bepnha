name: Phase 9C Task 3 Fix Determinism RED Once

on:
  push:
    paths:
      - ".github/workflows/phase9c-t3-fix-determinism-red-once.yml"

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/phase-9c-t3-red
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Keep production reference IDs stable under source shuffling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/catalog-pack/catalog-mutation-planner.test.ts")
          text = path.read_text()
          old = "buildResolvableProductionSnapshot(shuffledPack)"
          new = "buildResolvableProductionSnapshot(fixture.pack)"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one shuffled snapshot fixture")
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write scripts/catalog-pack/catalog-mutation-planner.test.ts
      - name: Commit corrected RED test and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase9c-t3-red-verify-once.yml
          git rm .github/workflows/phase9c-t3-fix-determinism-red-once.yml
          git add scripts/catalog-pack/catalog-mutation-planner.test.ts
          git commit -m "test: stabilize Phase 9C shuffled production fixture"
          git push origin HEAD:codex/phase-9c-t3-red
