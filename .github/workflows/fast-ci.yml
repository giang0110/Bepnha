name: Fast CI

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: git diff -- src/app/components/app-nav.tsx src/features/pantry/pantry-page.tsx src/features/plans/weekly-plan-page.tsx api/admin/meal-options.test.ts
      - run: npm run verify:web
      - run: npm run catalog:sheet -- import --dir docs/catalog/staging --out "$RUNNER_TEMP/catalog-pack.json"
      - run: npm run catalog:validate -- --input "$RUNNER_TEMP/catalog-pack.json"
      - run: npm run catalog:audit -- docs/catalog/staging
