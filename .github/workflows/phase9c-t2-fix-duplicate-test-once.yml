name: Phase 9C Task 2 Fix Duplicate Test Once

on:
  push:
    paths:
      - ".github/workflows/phase9c-t2-fix-duplicate-test-once.yml"

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/phase-9c-t2-red
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Replace tofu target without duplication
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/catalog-pack/catalog-mutation-planner.test.ts")
          text = path.read_text()
          old = '''      foods: [\n        {\n          ...firstFood,\n          identity: {\n            state: "existing",\n            id: existingFoodId,\n            revision: 1,\n            status: "published"\n          },\n          version: {\n            state: "missing",\n            id: null,\n            revision: null,\n            publicationStatus: null\n          }\n        },\n        ...fixture.manifest.foods.slice(1)\n      ]\n'''
          new = '''      foods: fixture.manifest.foods.map((food) =>\n        food.code === firstFood.code\n          ? {\n              ...food,\n              identity: {\n                state: "existing",\n                id: existingFoodId,\n                revision: 1,\n                status: "published"\n              },\n              version: {\n                state: "missing",\n                id: null,\n                revision: null,\n                publicationStatus: null\n              }\n            }\n          : food\n      )\n'''
          if old not in text:
              raise SystemExit("expected duplicate target block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write scripts/catalog-pack/catalog-mutation-planner.test.ts
      - name: Commit test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-pack/catalog-mutation-planner.test.ts
          git commit -m "test: replace tofu target without duplication"
          git push origin HEAD:codex/phase-9c-t2-red
