name: Production canary

# Runs the read-only production smoke against the deployed site on a schedule, so that "production
# is down" is something the repository notices rather than something a household discovers.
#
# This is the gap that made 2026-09-23 last as long as it did: plan generation was failing for every
# household and the only signal was a Vercel log nobody was reading. A failing workflow, by
# contrast, emails whoever watches the repository.
#
# Every check in tests/production is a read. Nothing signs up, signs in, or writes — production
# holds real households, and a canary that created an account would leave one behind every hour.
#
# Optional repository variable (not a secret; the origin is public):
#   BEPNHA_PRODUCTION_URL - overrides the canonical deployed origin when needed.
#                          If unset, the workflow uses https://bepnhatoi.vercel.app.
#
# Note that GitHub disables scheduled workflows after 60 days without repository activity.

on:
  schedule:
    # Every three hours. Often enough that an outage is measured in hours rather than days, rare
    # enough to stay far inside the free minutes.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-canary
  cancel-in-progress: true

jobs:
  smoke:
    name: Read-only smoke
    runs-on: ubuntu-latest
    steps:
      - name: Validate the production target
        env:
          PRODUCTION_URL: ${{ vars.BEPNHA_PRODUCTION_URL || 'https://bepnhatoi.vercel.app' }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL}" ]; then
            echo "Production canary target is empty." >&2
            exit 1
          fi
          case "${PRODUCTION_URL}" in
            https://*) ;;
            *)
              echo "Production canary target must use HTTPS: ${PRODUCTION_URL}" >&2
              exit 1
              ;;
          esac
          echo "Production canary target: ${PRODUCTION_URL}"

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Smoke the deployed site
        env:
          BEPNHA_PRODUCTION_URL: ${{ vars.BEPNHA_PRODUCTION_URL || 'https://bepnhatoi.vercel.app' }}
        run: npm run smoke:production

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
