name: Phase 9B Format Once

on:
  push:
    branches:
      - codex/phase-9b-production-reference-resolver
    paths:
      - .github/workflows/phase9b-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/phase-9b-production-reference-resolver
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Task 3 test and remove one-shot workflow
        run: |
          npx prettier --write scripts/catalog-pack/catalog-production-resolver.test.ts
          git rm .github/workflows/phase9b-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-pack/catalog-production-resolver.test.ts
          git diff --cached --check
          git commit -m "style: format Phase 9B collision tests"
          git push origin HEAD:codex/phase-9b-production-reference-resolver
