name: Task 7 format

on:
  push:
    branches:
      - codex/phase-4-task7-clean
    paths:
      - .github/workflows/task7-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-task7-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact Prettier output
        run: |
          npx prettier --write src/features/shopping/shopping-list-page.tsx src/features/shopping/shopping-list-page.test.tsx
          git diff --check
          if git diff --quiet -- src/features/shopping/shopping-list-page.tsx src/features/shopping/shopping-list-page.test.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/shopping/shopping-list-page.tsx src/features/shopping/shopping-list-page.test.tsx
          git commit -m "style: format shopping list experience"
          git push origin HEAD:codex/phase-4-task7-clean
