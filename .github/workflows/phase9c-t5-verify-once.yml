name: Phase 9C Task 5 Final Verify Once

on:
  push:
    branches:
      - codex/phase-9c-t5-final
    paths:
      - .github/workflows/phase9c-t5-verify-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 870ca180c94ed62263a3787c0971a5f9e7029c5b
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run scripts/catalog-pack/catalog-mutation-authority-regression.test.ts --reporter=verbose
      - run: npx vitest run scripts/catalog-pack --reporter=verbose
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:web
      - run: git diff --check
      - run: test -z "$(git status --porcelain)"
      - run: test "$(git rev-parse HEAD)" = "870ca180c94ed62263a3787c0971a5f9e7029c5b"
