name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      diagnose_production:
        description: "Read published production planner inputs and aggregate rollout state"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}${{ inputs.diagnose_production && '-diagnostic' || '' }}
  cancel-in-progress: true

jobs:
  production_catalog_diagnostic:
    # Manual and read-only. A reviewed branch may diagnose a rollout before it is merged.
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_production
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Inspect published planner inputs and aggregate plan versions
        env:
          BEPNHA_PRODUCTION_DB_URL: ${{ secrets.BEPNHA_PRODUCTION_DB_URL }}
          BEPNHA_DIAGNOSTIC_CHECK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { connectionEnvironment } from './scripts/verify-production-schema.mjs'
          try {
            const connection = connectionEnvironment(process.env.BEPNHA_PRODUCTION_DB_URL ?? '')
            const projectRef = 'vkrqzwlpneocgjwhqbsl'
            const direct = connection.PGHOST === `db.${projectRef}.supabase.co`
            const pooler = connection.PGHOST.endsWith('.pooler.supabase.com') &&
              connection.PGUSER === `postgres.${projectRef}`
            if ((!direct && !pooler) || (connection.PGPORT ?? '5432') !== '5432' ||
                !['require', 'verify-ca', 'verify-full'].includes(connection.PGSSLMODE)) {
              throw new Error('Invalid production target')
            }
            const result = execFileSync('psql', [
              '--no-psqlrc', '-q', '-t', '-A', '-v', 'ON_ERROR_STOP=1',
              '--file', 'scripts/diagnose-planner-catalog.sql'
            ], { env: { ...process.env, ...connection }, encoding: 'utf8', timeout: 30000,
              stdio: ['ignore', 'pipe', 'pipe'] })
            const report = JSON.parse(result)
            console.log(JSON.stringify({ projectRef, ...report }, null, 2))
            // Native check annotations avoid runner notice truncation and blocked log storage.
            const encoded = Buffer.from(JSON.stringify({ projectRef, ...report })).toString('base64')
            const chunks = encoded.match(/.{1,12000}/g) ?? []
            if (chunks.length === 0 || chunks.length > 50) throw new Error('Report too large')
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/check-runs`, {
              method: 'POST', signal: AbortSignal.timeout(15000),
              headers: { Authorization: `Bearer ${process.env.BEPNHA_DIAGNOSTIC_CHECK_TOKEN}`,
                Accept: 'application/vnd.github+json', 'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ name: 'Production catalog report', head_sha: process.env.GITHUB_SHA,
                status: 'completed', conclusion: 'success', output: {
                  title: 'Read-only production catalog report',
                  summary: 'Allowlisted catalog reference metadata and aggregate rollout counts; no household identifiers or body profiles.',
                  annotations: chunks.map((data, index) => ({ path: 'scripts/diagnose-planner-catalog.sql',
                    start_line: 1, end_line: 1, annotation_level: 'notice',
                    title: 'Production catalog diagnostic',
                    message: JSON.stringify({ format: 'planner-catalog-v1',
                      part: index + 1, parts: chunks.length, data }) }))
                } })
            })
            if (!response.ok) throw new Error('Report check unavailable')
          } catch {
            console.error('Production planner diagnostic failed. Check the database binding, schema and check permissions; credentials are not logged.')
            process.exitCode = 1
          }
          NODE

      - name: Check admin API configuration without catalog writes
        env:
          BEPNHA_ADMIN_ACCESS_TOKEN: ${{ secrets.BEPNHA_ADMIN_ACCESS_TOKEN }}
          BEPNHA_DIAGNOSTIC_CHECK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          try {
            const token = process.env.BEPNHA_ADMIN_ACCESS_TOKEN
            if (!token) throw new Error('ADMIN_DIAGNOSTIC_TOKEN_MISSING')
            const results = []
            for (const [stage, command] of [
              ['authentication', { action: 'check_admin_token', input: {} }],
              // Parsed by the handler, but rejected by application validation before any repository method.
              ['repository_construction', { action: 'create_food',
                input: { code: '', nameVi: '', baseDimension: 'mass', baseUnitId: '' } }]
            ]) {
              const response = await fetch('https://bepnhatoi.vercel.app/api/admin/catalog', {
                method: 'POST', redirect: 'error', signal: AbortSignal.timeout(30000),
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body: JSON.stringify(command)
              })
              const body = await response.json()
              const allowed = ['VALIDATION_FAILED', 'CATALOG_UNAVAILABLE', 'UNAUTHORIZED', 'ADMIN_REQUIRED']
              results.push({ stage, status: response.status,
                error: allowed.includes(body.error) ? body.error : 'UNEXPECTED_RESPONSE' })
            }
            const response = await fetch('https://api.github.com/repos/giang0110/Bepnha/check-runs', {
              method: 'POST', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Authorization: `Bearer ${process.env.BEPNHA_DIAGNOSTIC_CHECK_TOKEN}`,
                Accept: 'application/vnd.github+json', 'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ name: 'Production admin configuration diagnostic',
                head_sha: process.env.GITHUB_SHA, status: 'completed', conclusion: 'neutral',
                output: { title: 'Admin API configuration without catalog writes',
                  summary: 'Only sanitized status codes; no credentials or user data.',
                  text: JSON.stringify({ format: 'admin-config-diagnostic-v1', results }) } })
            })
            if (!response.ok) throw new Error('ADMIN_DIAGNOSTIC_CHECK_FAILED')
          } catch {
            console.error('::error::ADMIN_CONFIGURATION_DIAGNOSTIC_FAILED')
            process.exitCode = 1
          }
          NODE

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:web
      - run: npm run test:performance:planner
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run catalog:sheet -- import --dir docs/catalog/staging --out "$RUNNER_TEMP/catalog-pack.json"
      - run: npm run catalog:validate -- --input "$RUNNER_TEMP/catalog-pack.json"
      - run: npm run catalog:audit -- docs/catalog/staging

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight:db
      - run: npm run supabase:start
      - run: npm run supabase:reset
      - run: npm run supabase:lint
      - run: npm run supabase:test
      # A stale-types failure must say what changed. Without this the log says only "stale" and
      # the actual generator output is reachable solely by downloading the artifact below, which
      # needs a browser and network egress the person debugging may not have.
      - name: Check generated database types
        run: |
          set -uo pipefail
          if npm run db:types:check; then
            exit 0
          fi
          echo "::group::What the generator produces that the repository does not have"
          npm run db:types:generate
          git --no-pager diff -- src/infrastructure/supabase/database.types.ts
          echo "::endgroup::"
          exit 1
      - run: npm run test:integration
      - run: npm run test:integration:catalog-admin
      - run: npm run test:integration:planner
      - run: npm run test:integration:assistant
      - run: npm run test:integration:shopping
      - run: npm run test:integration:pantry
      - run: npm run supabase:reset
      - run: npm run test:integration:catalog-readiness
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:onboarding
      - run: npm run test:e2e:planner
      - run: npm run test:e2e:assistant
      - run: npm run test:e2e:shopping
      - run: npm run test:e2e:pantry
      - run: npm run test:e2e:accessibility
      - if: always()
        run: npm run db:types:generate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-types-${{ github.sha }}
          path: src/infrastructure/supabase/database.types.ts
      - if: always()
        run: npm run supabase:stop
