name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight:db
      - run: npm run supabase:start
      - run: npm run supabase:reset
      - run: npm run supabase:lint
      - run: npm run supabase:test
      - run: npm run db:types:check
      - run: npm run test:integration
      - run: npm run test:integration:catalog-admin
      - run: npm run test:integration:planner
      - run: npm run test:integration:shopping
      - run: npm run test:integration:pantry
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:onboarding
      - run: npm run test:e2e:planner
      - run: npm run test:e2e:shopping
      - run: npm run test:e2e:pantry
      - if: always()
        run: npm run db:types:generate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-types-${{ github.sha }}
          path: src/infrastructure/supabase/database.types.ts
      - if: always()
        run: npm run supabase:stop
