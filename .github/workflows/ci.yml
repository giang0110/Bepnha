name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      diagnose_production:
        description: "Read published production planner inputs and aggregate rollout state"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}${{ inputs.diagnose_production && '-diagnostic' || '' }}
  cancel-in-progress: true

jobs:
  production_catalog_diagnostic:
    # Manual and read-only. A reviewed branch may diagnose a rollout before it is merged.
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Inspect published planner inputs and aggregate plan versions
        env:
          BEPNHA_PRODUCTION_DB_URL: ${{ secrets.BEPNHA_PRODUCTION_DB_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { connectionEnvironment } from './scripts/verify-production-schema.mjs'
          try {
            const connection = connectionEnvironment(process.env.BEPNHA_PRODUCTION_DB_URL ?? '')
            const projectRef = 'vkrqzwlpneocgjwhqbsl'
            const direct = connection.PGHOST === `db.${projectRef}.supabase.co`
            const pooler = connection.PGHOST.endsWith('.pooler.supabase.com') &&
              connection.PGUSER === `postgres.${projectRef}`
            if ((!direct && !pooler) || (connection.PGPORT ?? '5432') !== '5432' ||
                !['require', 'verify-ca', 'verify-full'].includes(connection.PGSSLMODE)) {
              throw new Error('Invalid production target')
            }
            const result = execFileSync('psql', [
              '--no-psqlrc', '-q', '-t', '-A', '-v', 'ON_ERROR_STOP=1',
              '--file', 'scripts/diagnose-planner-catalog.sql'
            ], { env: { ...process.env, ...connection }, encoding: 'utf8', timeout: 30000,
              stdio: ['ignore', 'pipe', 'pipe'] })
            const report = JSON.parse(result)
            console.log(JSON.stringify({ projectRef, ...report }, null, 2))
          } catch {
            console.error('Production planner diagnostic failed. Check the database binding and schema; credentials are not logged.')
            process.exitCode = 1
          }
          NODE

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:web
      - run: npm run test:performance:planner
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run catalog:sheet -- import --dir docs/catalog/staging --out "$RUNNER_TEMP/catalog-pack.json"
      - run: npm run catalog:validate -- --input "$RUNNER_TEMP/catalog-pack.json"
      - run: npm run catalog:audit -- docs/catalog/staging

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight:db
      - run: npm run supabase:start
      - run: npm run supabase:reset
      - run: npm run supabase:lint
      - run: npm run supabase:test
      # A stale-types failure must say what changed. Without this the log says only "stale" and
      # the actual generator output is reachable solely by downloading the artifact below, which
      # needs a browser and network egress the person debugging may not have.
      - name: Check generated database types
        run: |
          set -uo pipefail
          if npm run db:types:check; then
            exit 0
          fi
          echo "::group::What the generator produces that the repository does not have"
          npm run db:types:generate
          git --no-pager diff -- src/infrastructure/supabase/database.types.ts
          echo "::endgroup::"
          exit 1
      - run: npm run test:integration
      - run: npm run test:integration:catalog-admin
      - run: npm run test:integration:planner
      - run: npm run test:integration:assistant
      - run: npm run test:integration:shopping
      - run: npm run test:integration:pantry
      - run: npm run supabase:reset
      - run: npm run test:integration:catalog-readiness
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:onboarding
      - run: npm run test:e2e:planner
      - run: npm run test:e2e:assistant
      - run: npm run test:e2e:shopping
      - run: npm run test:e2e:pantry
      - run: npm run test:e2e:accessibility
      - if: always()
        run: npm run db:types:generate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-types-${{ github.sha }}
          path: src/infrastructure/supabase/database.types.ts
      - if: always()
        run: npm run supabase:stop
