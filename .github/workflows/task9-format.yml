name: Task 9 format

on:
  push:
    branches:
      - codex/phase-4-task9-clean
    paths:
      - .github/workflows/task9-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-task9-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact Prettier output
        run: |
          npx prettier --write tests/shopping-list.spec.ts README.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/shopping-list.spec.ts README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Phase 4 browser flow and docs"
          git push origin HEAD:codex/phase-4-task9-clean
