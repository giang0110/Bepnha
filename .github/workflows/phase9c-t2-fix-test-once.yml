name: Phase 9C Task 2 Fix Test Once

on:
  push:
    paths:
      - ".github/workflows/phase9c-t2-fix-test-once.yml"

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/phase-9c-t2-red
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix explicit tofu fixture target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/catalog-pack/catalog-mutation-planner.test.ts")
          text = path.read_text()
          old = '''  test("uses the resolved UUID binding for an existing compatible food identity", () => {\n    const fixture = buildPlanningFixture()\n    const firstFood = fixture.manifest.foods[0]\n'''
          new = '''  test("uses the resolved UUID binding for an existing compatible food identity", () => {\n    const fixture = buildPlanningFixture()\n    const firstFood = fixture.manifest.foods.find((food) => food.code === "test_tofu")\n'''
          if old not in text:
              raise SystemExit("expected test block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write scripts/catalog-pack/catalog-mutation-planner.test.ts
      - name: Commit test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-pack/catalog-mutation-planner.test.ts
          git commit -m "test: target tofu identity explicitly"
          git push origin HEAD:codex/phase-9c-t2-red
