name: Phase 7 Task 2 Context RED

on:
  push:
    branches:
      - codex/phase-7-task2-context-red
    paths:
      - "src/infrastructure/server/supabase-assistant-context-repository.test.ts"
      - ".github/workflows/phase7-task2-context-red.yml"

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/infrastructure/server/supabase-assistant-context-repository.test.ts
