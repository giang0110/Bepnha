name: Task 7 format tests

on:
  push:
    branches:
      - codex/phase-4-task7-clean
    paths:
      - .github/workflows/task7-format-tests.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-task7-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Task 7 test files
        run: |
          npx prettier --write src/app/App.test.tsx src/features/shopping/shopping-list-page.test.tsx
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.test.tsx src/features/shopping/shopping-list-page.test.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format shopping UI tests"
          git push origin HEAD:codex/phase-4-task7-clean
